name: Checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract inline <script> blocks and check syntax
        run: node .github/scripts/check-syntax.js

      # Proves the golden-set scorer still catches the defects it claims to.
      # A scorer that only ever passes would make the next step meaningless.
      - name: Golden set — scorer self-test
        run: npm run eval:self

      # Scores the LIVE prompt (extracted from index.html) against recorded
      # reference outputs. No API key, no network, no cost. Catches prompt
      # contract drift: a renamed exclusion label, a changed output format, a
      # broken parser mirror.
      - name: Golden set — dry run
        run: npm run eval:dry
